<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grand Eldorado seat view</title>
<style>
  :root {
    --bg: oklch(0.14 0.004 285);
    --page: oklch(0.09 0.003 285);
    --ink: oklch(0.96 0.005 90);
    --muted: oklch(0.74 0.008 285);
    --faint: oklch(0.62 0.008 285);
    --line: oklch(1 0 0 / 0.1);
    --well: oklch(0.19 0.005 285);
    --raised: oklch(0.27 0.006 285);
    --outline: oklch(0.36 0.006 285);
    --green: oklch(0.81 0.12 160);
    --green-ink: oklch(0.2 0.04 160);
    --top-h: 12.5rem;
    --bar-h: 8rem;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--page); color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; display: grid; place-items: center; overflow: hidden;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: oklch(0.81 0.12 160 / 0.2); }
  button:focus-visible { outline: 0.125rem solid var(--green); outline-offset: 0.1875rem; }

  /* Phone layout first; desktop gets its own layout below. */
  .phone {
    position: relative; width: min(100vw, 24.375rem); height: min(100dvh, 52.875rem);
    background: var(--bg); border-radius: 2.75rem; overflow: hidden;
    box-shadow: 0 0 0 0.0625rem var(--line), 0 2.5rem 5rem oklch(0 0 0 / 0.5);
    user-select: none; -webkit-user-select: none;
  }
  @media (max-width: 30rem) { .phone { border-radius: 0; box-shadow: none; } }

  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transition: opacity 180ms ease-out; touch-action: none; }
  .phone[data-state="map"] #gl, .phone[data-state="view"] #gl { cursor: grab; }
  .phone[data-drag] #gl, .phone[data-state="view"] #gl:active { cursor: grabbing; }

  .layer { position: absolute; inset: 0; pointer-events: none; }
  .layer > * { pointer-events: auto; }

  /* Header: the title, one supporting line, then the film and showtime switchers. */
  .top {
    position: absolute; top: 0; left: 0; right: 0; z-index: 2; padding: 1.5rem 1rem 1rem;
    background: linear-gradient(var(--bg) calc(100% - 0.75rem), oklch(0.14 0.004 285 / 0));
  }
  .top h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.015em; line-height: 1.2; }
  .top .where-at { font-size: 0.75rem; color: var(--muted); margin-top: 0.25rem; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 0.25rem; padding: 0.25rem; margin-top: 1rem; background: var(--well); border-radius: 0.875rem; }
  .seg button {
    min-height: 2.75rem; padding: 0.5rem; border-radius: 0.625rem; display: grid; place-items: center; text-align: center;
    font-size: 0.9375rem; font-weight: 600; color: var(--muted); line-height: 1.25;
  }
  .seg button small { display: block; font-size: 0.75rem; font-weight: 400; color: var(--faint); font-variant-numeric: tabular-nums; }
  .seg button[aria-checked="true"] { background: var(--raised); color: var(--ink); box-shadow: 0 0 0 0.03125rem var(--outline), 0 0.0625rem 0.125rem oklch(0 0 0 / 0.5); }
  .seg button[aria-checked="true"] small { color: var(--muted); }
  .times { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
  .times button {
    flex: 1; max-width: 7.5rem; min-height: 2.75rem; padding: 0.25rem 0.75rem; border-radius: 0.75rem;
    display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
    box-shadow: inset 0 0 0 0.0625rem var(--outline); font-size: 0.9375rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2;
  }
  .times button small { font-size: 0.75rem; font-weight: 400; color: var(--muted); letter-spacing: 0.01em; }
  .times button[aria-checked="true"] { background: var(--ink); color: oklch(0.15 0 0); box-shadow: none; }
  .times button[aria-checked="true"] small { color: oklch(0.38 0 0); }

  /* The map region sits over the canvas: it draws row letters and the tooltip; pointer input goes to the 3D model. */
  .map { position: absolute; top: var(--top-h); bottom: var(--bar-h); left: 0; right: 0; overflow: hidden; }
  .layer > .map { pointer-events: none; }
  /* The seat list stays in the DOM for keyboards and screen readers; focus shows as a ring in the 3D model. */
  .plan { position: absolute; width: 0.0625rem; height: 0.0625rem; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .rl { position: absolute; left: 0; top: 0; font-size: 0.6875rem; font-weight: 600; color: var(--faint); transform: translate(-50%, -50%); }
  .rl[hidden] { display: none; }
  .tip {
    position: absolute; left: 0; top: 0; z-index: 4; padding: 0.5rem 0.75rem; border-radius: 0.625rem;
    background: oklch(0.97 0.004 90); color: oklch(0.18 0.006 285); font-size: 0.75rem; line-height: 1.3; white-space: nowrap;
    box-shadow: 0 0.25rem 1rem oklch(0 0 0 / 0.35), 0 0.0625rem 0.125rem oklch(0 0 0 / 0.3);
    opacity: 0; pointer-events: none;
  }
  .tip strong { display: block; font-size: 0.8125rem; font-weight: 600; }
  .tip span { color: oklch(0.42 0.01 285); font-variant-numeric: tabular-nums; }
  .tip::after { content: ""; position: absolute; left: var(--arrow-x, 50%); bottom: -0.3125rem; width: 0.625rem; height: 0.625rem; margin-left: -0.3125rem; background: inherit; rotate: 45deg; border-radius: 0.125rem; }
  .tip[data-below="true"]::after { bottom: auto; top: -0.3125rem; }
  .tip.on { opacity: 1; }

  /* The slot under the map: the key, then the prompt or the chosen seat, then the price. Its height never changes. */
  .credit { position: absolute; top: 1.5rem; right: 1rem; margin: 0; font-size: 0.6875rem; color: var(--muted); }
  .credit a { color: inherit; text-decoration: underline; text-underline-offset: 0.125rem; }
  .bar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    padding: 1rem 1rem max(1rem, env(safe-area-inset-bottom));
    background: oklch(0.17 0.005 285); border-radius: 1.5rem 1.5rem 0 0; box-shadow: 0 -0.0625rem 0 var(--line);
  }
  .legend { display: flex; gap: 1.5rem; list-style: none; padding: 0; font-size: 0.75rem; color: var(--faint); }
  .legend li { display: flex; align-items: center; gap: 0.5rem; }
  /* Swatches coloured like the seats on the map: light, dark, green. */
  .sw { width: 0.875rem; height: 0.875rem; border-radius: 0.25rem; display: block; }
  .sw.a { background: oklch(0.82 0.015 285); }
  .sw.t { background: oklch(0.32 0.008 285); }
  .sw.s { background: oklch(0.78 0.13 160); }
  .status { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.75rem; padding-top: 0.75rem; box-shadow: 0 -0.03125rem 0 var(--line); height: 4.25rem; }
  .pick { flex: 1; min-width: 0; }
  .status .what { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.015em; line-height: 1.2; }
  .status .what.hint { font-size: 0.9375rem; display: flex; align-items: center; gap: 0.5rem; letter-spacing: 0; }
  .status .what.hint svg { width: 1rem; height: 1rem; flex: none; color: var(--green); }
  .status .sub2 { font-size: 0.75rem; color: var(--muted); margin-top: 0.25rem; min-height: 0.9375rem; font-variant-numeric: tabular-nums; }
  .facts { font-size: 0.75rem; color: var(--muted); margin-top: 0.5rem; font-variant-numeric: tabular-nums; }
  .zoom {
    flex: none; padding: 0; width: 2.75rem; height: 2.75rem; display: grid; place-items: center; border-radius: 62rem; color: var(--ink);
    background: var(--raised); box-shadow: 0 0 0 0.03125rem var(--outline), 0 0.0625rem 0.125rem oklch(0 0 0 / 0.5);
  }
  .zoom svg { width: 1.125rem; height: 1.125rem; }
  .cta { flex: none; min-height: 2.75rem; padding: 0 1.25rem; white-space: nowrap; border-radius: 62rem; background: var(--green); color: var(--green-ink); font-size: 0.875rem; font-weight: 600; }
  .cta[hidden] { display: none; }

  /* View from the seat */
  #viewUi { opacity: 0; }
  #viewUi.on { opacity: 1; }
  .back {
    position: absolute; top: 1.25rem; left: 1rem; min-width: 2.75rem; height: 2.75rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    border-radius: 62rem; background: oklch(0.12 0.004 285 / 0.72); backdrop-filter: blur(0.75rem); -webkit-backdrop-filter: blur(0.75rem);
  }
  .back svg { width: 1rem; height: 1rem; }
  .back span { display: none; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 1.75rem 1.25rem max(1.25rem, env(safe-area-inset-bottom));
    background: oklch(0.17 0.008 20 / 0.94); border-radius: 1.5rem 1.5rem 0 0;
    backdrop-filter: blur(1rem); -webkit-backdrop-filter: blur(1rem); transform: translateY(105%);
  }
  .sheet::before { content: ""; position: absolute; top: 0.625rem; left: 50%; width: 2.25rem; height: 0.1875rem; margin-left: -1.125rem; border-radius: 62rem; background: oklch(1 0 0 / 0.22); }
  #viewUi.on .sheet { transform: none; }
  .sheet .head2 { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
  .sheet h2 { font-size: 1.375rem; font-weight: 600; letter-spacing: -0.02em; }
  .sheet h2:focus { outline: none; }
  .tag { font-size: 0.75rem; font-weight: 600; color: var(--green); margin-top: 0.25rem; }
  .sub { font-size: 0.75rem; color: var(--muted); margin-top: 0.125rem; font-variant-numeric: tabular-nums; }
  .mini { width: 4.5rem; height: 3.75rem; flex: none; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.375rem; margin-top: 1rem; }
  .stats div { background: oklch(1 0 0 / 0.05); border-radius: 0.75rem; padding: 0.625rem 0.75rem; display: flex; flex-direction: column-reverse; }
  .stats dd { font-size: 1rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stats dt { font-size: 0.6875rem; color: var(--muted); margin-top: 0.125rem; }
  .acts { display: flex; gap: 0.5rem; margin-top: 1rem; }
  .acts button { min-height: 2.75rem; padding: 0 1rem; border-radius: 62rem; font-size: 0.875rem; font-weight: 600; }
  .solid { flex: 1; background: var(--ink); color: oklch(0.15 0 0); font-variant-numeric: tabular-nums; }
  .fine { font-size: 0.6875rem; color: var(--muted); margin-top: 0.625rem; text-align: center; }

  /* Desktop is its own layout: full frame, the header and switchers in one row, the map filling the rest. */
  @media (min-width: 48rem) {
    body { display: block; }
    .phone { width: 100vw; height: 100dvh; border-radius: 0; box-shadow: none; }
    .top { display: flex; align-items: center; gap: 2rem; padding: 1rem 1.5rem; background: var(--bg); box-shadow: 0 0.03125rem 0 var(--line); }
    .titles { flex: 1; min-width: 0; }
    .top h1 { font-size: 2rem; font-weight: 650; letter-spacing: -0.025em; }
    .top .where-at { font-size: 1rem; margin-top: 0.25rem; }
    .seg { margin-top: 0; width: 24rem; flex: none; }
    .times { margin-top: 0; flex: none; }
    .times button { width: 6.5rem; flex: none; }
    .bar { height: 5rem; padding: 0 1.5rem; border-radius: 0; display: grid; grid-template-columns: auto 1fr auto; align-items: center; column-gap: 2rem; }
    .bar .status { margin-top: 0; padding: 0 2rem; height: 3.5rem; box-shadow: -0.03125rem 0 0 var(--line), 0.03125rem 0 0 var(--line); }
    .facts { margin-top: 0; font-size: 0.9375rem; color: var(--ink); font-weight: 600; }
    .zoom { position: fixed; top: calc(var(--top-h) + 1rem); right: 1.5rem; z-index: 3; }
    .back { padding: 0 1.125rem 0 0.875rem; font-size: 0.875rem; font-weight: 600; top: 1.5rem; left: 1.5rem; }
    .back span { display: inline; }
    .sheet { left: 1.5rem; right: auto; bottom: 1.5rem; width: 24rem; border-radius: 1.5rem; }
  }

  /* States: rest, hover, focus (ring outside), pressed, selected. Hover only where a fine pointer can hover. */
  button:active:not([aria-disabled="true"]) { scale: 0.97; }
  @media (hover: hover) and (pointer: fine) {
    .seg button:not([aria-checked="true"]):hover { color: var(--ink); background: oklch(1 0 0 / 0.04); }
    .times button:not([aria-checked="true"]):hover { box-shadow: inset 0 0 0 0.0625rem oklch(0.5 0.008 285); background: oklch(1 0 0 / 0.04); }
    .back:hover { background: oklch(0.12 0.004 285 / 0.88); }
    .zoom:hover { background: oklch(0.31 0.006 285); }
    .cta:hover { background: oklch(0.85 0.12 160); }
  }
  @media (prefers-reduced-motion: no-preference) {
    button { transition: scale 150ms var(--ease-out), background-color 160ms var(--ease-out), color 160ms var(--ease-out), box-shadow 160ms var(--ease-out); }
    #viewUi { transition: opacity 200ms ease-out; }
    .tip { transition: opacity 120ms var(--ease-out); }
    .sheet { transition: transform 200ms ease-in; }
    #viewUi.on .sheet { transition: transform 320ms var(--ease-drawer); }
  }
  @media (prefers-reduced-motion: reduce) {
    .sheet { transform: none; }
    #viewUi { transition: opacity 180ms ease-out; }
  }
</style>
</head>
<body>
<main class="phone" id="phone" data-state="map" data-zoom="overview">
  <canvas id="gl" aria-hidden="true"></canvas>

  <section class="layer" id="mapUi" aria-label="Choose a seat">
    <div class="top">
      <div class="titles">
        <h1>Pick a seat, see your view</h1>
        <p class="where-at">Grand Eldorado, UGC De Brouckère, Wed 16 Dec</p>
      </div>
      <div class="seg" role="radiogroup" aria-label="Film" id="films"></div>
      <div class="times" role="radiogroup" aria-label="Showtime" id="times"></div>
    </div>

    <div class="map" id="map">
      <div class="plan" id="plan" role="group" aria-label="Seats in the hall, the screen is at the top"></div>
    </div>
    <div class="bar" id="bar">
      <ul class="legend" aria-label="Seat key">
        <li><span class="sw a"></span>Free</li>
        <li><span class="sw t"></span>Taken</li>
        <li><span class="sw s"></span>Your seat</li>
      </ul>
      <div class="status">
        <div class="pick" aria-live="polite">
          <p class="what" id="what"></p>
          <p class="sub2" id="sub2"></p>
        </div>
        <button class="zoom" id="zoom" type="button"></button>
        <button class="cta" id="see" type="button" hidden>See the view</button>
      </div>
      <p class="facts" id="facts"></p>
    </div>
  </section>

  <section class="layer" id="viewUi" aria-label="View from your seat" inert>
    <button class="back" id="back" type="button" aria-label="Back to the seat map">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg><span>Back to the map</span>
    </button>
    <div class="sheet">
      <div class="head2">
        <div>
          <h2 id="seatName" tabindex="-1"></h2>
          <p class="tag" id="tag"></p>
          <p class="sub" id="seatSub"></p>
        </div>
        <svg class="mini" id="mini" aria-hidden="true"></svg>
      </div>
      <dl class="stats">
        <div><dt>to the screen</dt><dd id="sDist"></dd></div>
        <div><dt>screen angle</dt><dd id="sFov"></dd></div>
        <div><dt id="sSideL"></dt><dd id="sSide"></dd></div>
      </dl>
      <div class="acts">
        <button class="solid" id="pick" type="button">Select this seat</button>
      </div>
      <p class="fine">Demo only, nothing is booked.</p>
    </div>
      <p class="credit">Wall reliefs from photos by <a href="https://commons.wikimedia.org/wiki/Category:UGC_De_Brouck%C3%A8re" target="_blank" rel="noreferrer">AdriMela</a>, <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noreferrer">CC BY-SA 4.0</a></p>
  </section>
</main>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = (id) => document.getElementById(id);
const phone = $('phone'), canvas = $('gl'), mapUi = $('mapUi'), viewUi = $('viewUi'), mapEl = $('map'), plan = $('plan');
const reduce = matchMedia('(prefers-reduced-motion: reduce)');

/* ---------- Films and showtimes, Grand Eldorado, Wed 16 Dec 2026 ---------- */

const FILMS = [
  { title: 'Avengers: Doomsday', runtime: '2h45', format: 'Infinity Vision', def: 2, shows: [
    { time: '00:05', v: 'VOSTBIL', taken: 260, seed: 11 },
    { time: '13:00', v: 'VF', taken: 150, seed: 23 },
    { time: '20:00', v: 'VOSTBIL', taken: 547, seed: 37, real: true },
  ] },
  { title: 'Dune: Part Three', runtime: '2h20', def: 0, shows: [
    { time: '16:30', v: 'VOSTBIL', taken: 310, seed: 53 },
  ] },
];
// 15,25 € full price plus 1,00 € for films over 2h10: the same for both films and every seat.
const PRICE = 16.25;
const money = (n) => new Intl.NumberFormat('fr-BE', { style: 'currency', currency: 'EUR' }).format(n);

/* ---------- The real seat plan: 706 seats, stalls A to V, balcony a to f ----------
   Numbering runs from the right (1) to the left, as on the cinema's own map.
   Rows S to V and the balcony blocks are read from the map (ref/ugc-seatmap-doomsday-2000.txt).
   Rows A to R are fitted so the hall adds up to its real 706 seats. */
const PITCH = 0.5, CURVE = 0.012;
const range = (a, b, skip = []) => { const o = []; for (let n = a; n <= b; n++) if (!skip.includes(n)) o.push(n); return o; };
const STALLS = 'ABCDEFGHIJKLMNOPQRSTUV'.split(''), BALC = 'abcdef'.split('');
function stallNums(L) {
  if ('ABCD'.includes(L)) return [...range(1, 10), ...range(23, 32)];
  if ('EFGHIV'.includes(L)) return range(5, 28);
  if (L === 'R') return range(2, 31);
  if ('STU'.includes(L)) return range(1, 32);
  return range(3, 30);
}
// Booking-map units: 35 per seat, an aisle after seat 6 and after seat 26 (rows E to V).
function stallX(L, n) {
  if ('ABCD'.includes(L)) return (16.5 - n) * PITCH;
  const u = 1160 - 35 * (n - 1) - (n >= 7 ? 35 : 0) - (n >= 27 ? 35 : 0);
  return (u - 582.5) / 35 * PITCH;
}
function balcNums(L) {
  if (L === 'a') return range(10, 22, [21]);
  if (L === 'b') return [...range(5, 9), ...range(10, 22, [21]), ...range(23, 27)];
  if (L === 'e') return range(3, 29);
  if (L === 'f') return [...range(3, 10), ...range(12, 20), ...range(22, 29)];
  return range(5, 27);
}
const balcX = (L, n) => (16 - n) * PITCH + ('bcde'.includes(L) ? (n <= 9 ? 0.4 : n >= 23 ? -0.4 : 0) : 0);
// Real taken seats, Avengers: Doomsday, 20:00, read 13 Nov 2026.
const REAL = { S: [...range(3, 14), ...range(16, 29)], T: range(7, 26), U: range(13, 22), V: range(15, 20) };

/* ---------- Hall (metres). Screen at z = 0, seats face -z. ---------- */
const SCREEN = { w: 9.6, h: 4.1, y: 4.3 };
const HW = 9.4, HZ0 = 3.5, HZ1 = 26.2, WALL_H = 9.6, CEIL = 10.8;
const BAL = { y: 6.95, top: 8.05, z: (x) => 18.4 + 1.1 * (1 - (x / HW) ** 2) };
const rowZ = (r) => 5.4 + r * 0.86, rowY = (r) => r * 0.13;
const MAP_ROW = 0.36, MAP_BAL = STALLS.length * MAP_ROW + 1.0;

const seats = [], rows = [];
STALLS.forEach((L, r) => {
  const row = { L, i: rows.length, seats: [] }; rows.push(row);
  for (const n of stallNums(L)) {
    const x = stallX(L, n), z = rowZ(r) + CURVE * x * x;
    const st = { i: seats.length, row: row.i, L, n, x, y: rowY(r), z, yaw: Math.atan2(x, z + 6), mx: x, mz: r * MAP_ROW,
      code: L + n, name: `Row ${L}, seat ${n}`, area: 'Stalls' };
    seats.push(st); row.seats.push(st);
  }
});
BALC.forEach((L, k) => {
  const row = { L, i: rows.length, seats: [] }; rows.push(row);
  for (const n of balcNums(L)) {
    const x = balcX(L, n), z = BAL.z(x) + 0.8 + k * 0.92;
    const st = { i: seats.length, row: row.i, L, n, x, y: BAL.y + 0.4 + k * 0.42, z, yaw: Math.atan2(x, z + 6), mx: x, mz: MAP_BAL + k * MAP_ROW,
      code: L + n, name: `Balcony row ${L}, seat ${n}`, area: 'Balcony' };
    seats.push(st); row.seats.push(st);
  }
});
rows.forEach((r) => r.seats.sort((a, b) => a.x - b.x)); // screen left to right
const N = seats.length; // 706
const X0 = -9.2, X1 = 9.2, Z0 = -1.15, Z1 = MAP_BAL + 5 * MAP_ROW + 0.3;

/* ---------- Taken seats per show. Rows S to V of the 20:00 show are real; the rest are simulated. ---------- */
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const takenCache = new Map();
